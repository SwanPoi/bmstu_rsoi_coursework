apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  # annotations:
  #   nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: car-rental.local 
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway-svc 
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80  

  - host: idp-svc
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: idp-svc
              port:
                number: 8090
  - http: 
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-svc  
            port:
              number: 8080