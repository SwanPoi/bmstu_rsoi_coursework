name: GitHub Classroom Workflow
on:
  push:
    branches: [ master ]
jobs:
  build:
    name: Build and publish services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        timeout-minutes: 10
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: | 
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Unit Tests
        run: |
          cd src/car
          go test -v ./...
          cd ../rental
          go test -v ./...
          cd ../payment
          go test -v ./...
          cd ../..

  deploy:
    name: Deploy to Minikube
    runs-on: ubuntu-latest
    needs: [build, unit-test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Minikube
        uses: manusa/actions-setup-minikube@v2.14.0
        with:
          minikube version: 'v1.32.0'
          kubernetes version: 'v1.28.0'
          driver: docker

      - name: Start Minikube
        run: |
          echo "=== Start Minikube ==="
          minikube start
          minikube addons enable ingress

      - name: Check Minikube
        run: |
          echo "=== Check Minikube ==="
          minikube status

      - name: Wait Ingress
        run: |
          echo "=== Wait ingress ==="
          until kubectl get svc -n ingress-nginx ingress-nginx-controller-admission 2>/dev/null; do
            sleep 5
          done

          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      - name: Install Helm charts
        run: |
          kubectl create namespace test
          cd ./k8s

          echo "=== Install database ==="
          helm install -n test postgres ./postgres 

          echo "=== Check database pods status ==="
          kubectl get pods -n test -l app=postgres

          echo "=== Wait database pods ==="
          kubectl wait --for=condition=ready pod -n test -l app=postgres --timeout=300s

          echo "Database is ready"

          echo "=== Install redis ==="
          helm install -n test redis ./redis

          echo "=== Check redis pods status ==="
          kubectl get pods -n test -l app=redis

          echo "=== Wait redis pods ==="
          kubectl wait --for=condition=ready pod -n test -l app=redis --timeout=300s

          echo "Redis is ready"
          
          echo "=== Install Kafka ==="
          helm install -n test kafka ./kafka

          echo "=== Check kafka pods status ==="
          kubectl get pods -n test -l app=kafka

          echo "=== Wait kafka pods ==="
          kubectl wait --for=condition=ready pod -n test -l app=kafka --timeout=300s

          echo "Kafka is ready"

          echo "=== Install IdP service ==="
          helm install -n test idp ./idp

          echo "=== Check idp pods status ==="
          kubectl get pods -n test -l app=idp

          echo "=== Wait idp pods ==="
          kubectl wait --for=condition=ready pod -n test -l app=idp --timeout=300s

          echo "IdP is ready"

          echo "=== Install services ==="
          helm install -n test services ./services

          echo "=== Wait services pods ==="
          kubectl wait -n test -l app=gateway pod --for=condition=ready --timeout=3m
          kubectl wait -n test -l app=cars pod --for=condition=ready --timeout=3m
          kubectl wait -n test -l app=rental pod --for=condition=ready --timeout=3m
          kubectl wait -n test -l app=payment pod --for=condition=ready --timeout=3m
          kubectl wait -n test -l app=stats pod --for=condition=ready --timeout=3m

          echo "=== Pods status ==="
          kubectl get all -n test -l app

          echo "=== Install frontend ==="
          helm install -n test frontend ./frontend

          echo "=== Check frontend pods status ==="
          kubectl get pods -n test -l app=frontend

          echo "=== Wait frontend pods ==="
          kubectl wait --for=condition=ready pod -n test -l app=frontend --timeout=300s

          echo "Frontend is ready"
  
      - name: Deploy Ingress
        run: |
          kubectl apply -f ./k8s/ingress.yaml -n test

          echo "=== Waiting for Ingress ==="
          for i in {1..30}; do 
            INGRESS_ADDRESS=$(kubectl get ingress gateway-ingress -n test -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -z "$INGRESS_ADDRESS" ]; then
              INGRESS_ADDRESS=$(kubectl get ingress gateway-ingress -n test -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            fi
            
            if [ -n "$INGRESS_ADDRESS" ]; then
              echo "Ingress is ready! Ingress address: $INGRESS_ADDRESS"
              break
            fi
            
            echo "Attempt $i: Ingress address not yet assigned, waiting 20s..."
            sleep 15
            
            if [ $i -eq 30 ]; then
              echo "Timeout, stop waiting of Ingress address"
              kubectl describe ingress gateway-ingress -n test
              exit 1
            fi
          done

      - name: Setup port forwarding
        run: |
          echo "=== Setup port forwarding to ingress on port 8080 ==="
          kubectl port-forward service/ingress-nginx-controller -n ingress-nginx 8080:80 &
          echo $! > /tmp/pf-ingress.pid
          sleep 10
          curl -f http://localhost:8080/manage/health

          echo "=== Setup port forwarding to IdP on port 8090 ==="
          kubectl port-forward svc/idp-svc 8090:8090 -n test &
          echo $! > /tmp/pf-idp.pid
          sleep 5
          curl -f http://localhost:8090/manage/health

          echo "=== Setup port forwarding to Gateway on port 8081 ==="
          kubectl port-forward svc/gateway-svc 8081:8080 -n test &
          echo $! > /tmp/pf-gateway.pid
          sleep 5
          curl -f http://localhost:8081/manage/health

          echo "=== Setup port forwarding to Frontend on port 4200 ==="
          kubectl port-forward svc/frontend-svc 4200:80 -n test &
          echo $! > /tmp/pf-frontend.pid
          sleep 5
          curl -f http://localhost:4200 || echo "Frontend health check skipped (nginx returns HTML)"

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v3/postman/collection.json
          environment: v3/postman/environment.json
          delayRequest: 300
          reporters: '[ "cli" ]'

      - name: Show logs on failure
        if: failure()
        run: |
          for pod in $(kubectl get pods -l app -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== Logs for pod: $pod ==="
            kubectl logs $pod
            echo "=== End logs for $pod ==="
            echo
          done

      - name: Stop port forwarding
        if: always()
        run: |
          for pidfile in /tmp/pf-ingress.pid /tmp/pf-idp.pid /tmp/pf-gateway.pid /tmp/pf-frontend.pid; do
            if [ -f "$pidfile" ]; then
              echo "=== Stopping port forwarding from $pidfile ==="
              kill $(cat "$pidfile") 2>/dev/null || true
              rm -f "$pidfile"
            fi
          done

      - name: Stop Minikube
        if: always()
        run: |
          echo "=== Stopping Minikube ==="
          minikube stop